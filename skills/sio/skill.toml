# package.nix builds the bundled Rust crate from Cargo.*, LICENSE and src only;
# the live target/ directory is deliberately unreachable from the derivation.
status = "ready"
agents = ["claude-code", "codex"]
platforms = ["darwin", "linux"]
groups = ["hardware"]

[source]
include = ["SKILL.md"]

[provides]
commands = ["sio"]
paths = [".local/bin/sio"]
