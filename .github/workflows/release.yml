name: release

# Cut a release by pushing a version tag: `git tag v0.4.0 && git push origin v0.4.0`.
# Builds a per-target binary, packages it as `sio-<target>.tar.gz` (the name
# `cargo binstall sio-serial` expects; see [package.metadata.binstall] in
# Cargo.toml), attaches a SHA-256 sidecar, attests build provenance, and
# uploads everything to a draft GitHub Release. The release is published only
# after every lane has uploaded, so it is never public with assets missing.
#
# Run `cargo publish` only after the `publish` job is green: `cargo binstall`
# downloads from this release, which 404s while it is a draft.
# Recovery: a failed lane → "Re-run failed jobs"; a cancelled run → "Re-run
# all jobs" (the draft is reused). To publish by hand after checking all 12
# assets: `gh release edit <tag> --draft=false --latest`.
#
# Linux builds are glibc, not musl: serialport reads USB serial numbers
# through libudev, which its musl build omits, and `--serial` needs them.
# Ubuntu 22.04 runners keep the glibc floor at 2.35.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets
  id-token: write # OIDC token for keyless attestation
  attestations: write # write build provenance

jobs:
  create-release:
    name: create release
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Create the draft only when the release does not exist; any other
        # `view` error fails the job instead of making a second draft.
        run: |
          if out=$(gh release view "$GITHUB_REF_NAME" 2>&1); then
            echo "release $GITHUB_REF_NAME exists"
          elif [[ $out == *"release not found"* ]]; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          else
            printf '%s\n' "$out" >&2
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    steps:
      - uses: actions/checkout@v7

      - name: Install libudev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libudev-dev pkg-config

      # rust-toolchain.toml pins the toolchain; add the target to it.
      - name: Install target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} --bin sio

      - name: Package
        id: pkg
        shell: bash
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          archive="sio-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" "sio${ext}"
          # sha256sum on Linux/Git-Bash; shasum on macOS.
          (sha256sum "$archive" || shasum -a 256 "$archive") > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.pkg.outputs.archive }}

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.pkg.outputs.archive }}" \
            "${{ steps.pkg.outputs.archive }}.sha256" \
            --clobber

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
