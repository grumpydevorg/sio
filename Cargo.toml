[package]
name = "sio-serial"
version = "0.4.0"
edition = "2024"
rust-version = "1.98.0"
description = "Safe, agent-friendly serial I/O: an interactive terminal and an NDJSON session protocol for automation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/grumpydevorg/sio"
readme = "README.md"
authors = ["Supersensory Technologies <dev@supersensory.ai>"]
keywords = ["serial", "uart", "tty", "cli", "agent"]
categories = ["command-line-utilities", "hardware-support"]
# The crate is published as sio-serial because `sio` is taken on crates.io;
# the library and the installed command are both `sio`.
include = [
    "/src/**/*.rs",
    "/skills/sio/SKILL.md",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/sio-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[lib]
name = "sio"
path = "src/lib.rs"

[[bin]]
name = "sio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.8"
thiserror = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
