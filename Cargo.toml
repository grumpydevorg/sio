[package]
name = "sio"
version = "0.3.0"
edition = "2024"
rust-version = "1.98.0"
description = "Safe, agent-friendly serial I/O for terminals and automation"
license = "MIT OR Apache-2.0"
authors = ["Supersensory Technologies <dev@supersensory.ai>"]
publish = false

[[bin]]
name = "sio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.8"
thiserror = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
